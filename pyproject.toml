[project]
name = "call-me-mabye"
version = "0.1.0"
description = "Function calling with constrained decoding"
readme = "README.md"
requires-python = ">=3.10"

# Runtime dependencies needed by the application
dependencies = [
    "llm-sdk",
    "memory-profiler>=0.61.0",
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
    "snakeviz>=2.2.2",
]

# Development tools (not needed by users)
[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
]

# Pytest configuration
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Local SDK included with the project
[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
